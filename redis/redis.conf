################################## NETWORK #####################################
# 监听所有网卡（容器内通过 docker 网络以服务名 redis 访问）
bind 0.0.0.0
# 已有密码保护，允许非本机连接
protected-mode yes
port 6379
tcp-keepalive 300

################################# GENERAL ######################################
daemonize no
loglevel notice
# 留空 = 日志输出到 stdout，交给 docker 采集
logfile ""

################################## SECURITY ###################################
# 访问密码不在此文件写死：由 compose 通过 config/redis.env 的 REDIS_PASSWORD
# 以 `redis-server --requirepass` 参数注入（见 docker-compose.yml），单一来源。
# 直接裸跑本文件时无密码，如需可临时追加 `--requirepass <密码>`。

############################## MEMORY MANAGEMENT ###############################
maxmemory 256mb
# 该实例主要存放 token 白名单/黑名单，宁可写失败也不静默淘汰登录态
maxmemory-policy noeviction

################################# SNAPSHOTTING #################################
save 900 1
save 300 10
save 60 10000

############################## APPEND ONLY MODE ################################
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
