services:
  db:
    image: mysql:8.0
    container_name: danica-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-1234}
      MYSQL_DATABASE: ${DB_DATABASE:-my_website}
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  back:
    image: danica6/danicaweb_back
    build: ./back
    container_name: danica-back
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:-1234}
      - DB_DATABASE=${DB_DATABASE:-my_website}
      - JWT_SECRET=${JWT_SECRET:-change-me}
      - REFRESH_SECRET=${REFRESH_SECRET:-change-me-too}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-1h}
      - REFRESH_EXPIRES_IN=${REFRESH_EXPIRES_IN:-7d}
      - BCRYPT_SALT_ROUNDS=${BCRYPT_SALT_ROUNDS:-10}
      - SITE_URL=${SITE_URL:-http://localhost}
      - SITE_TITLE=${SITE_TITLE:-Danica}
      - SITE_DESCRIPTION=${SITE_DESCRIPTION:-个人博客}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - MAIL_FROM=${MAIL_FROM:-Danica <noreply@resend.dev>}
      - MAIL_CODE_EXPIRES_IN=${MAIL_CODE_EXPIRES_IN:-300}
      - MAIL_RESEND_INTERVAL=${MAIL_RESEND_INTERVAL:-60}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/rss').then(r => r.ok?process.exit(0):process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  front:
    image: danica6/danicaweb_front
    build: ./front
    container_name: danica-front
    ports:
      - "80:80"
    depends_on:
      - back
    restart: unless-stopped

  manager:
    image: danica6/danicaweb_front_manager
    build: ./front-manager
    container_name: danica-manager
    profiles: ["admin"]
    ports:
      - "8080:80"
    depends_on:
      - back
    restart: unless-stopped

volumes:
  mysql-data:
