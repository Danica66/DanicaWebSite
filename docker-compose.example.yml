services:
  db:
    image: mysql:8.0
    container_name: danica-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-请修改我}
      MYSQL_DATABASE: ${DB_DATABASE:-my_website}
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  back:
    build: ./back
    container_name: danica-back
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:-请修改我}
      - DB_DATABASE=${DB_DATABASE:-my_website}
      - JWT_SECRET=${JWT_SECRET:-请生成一个随机字符串}
      - REFRESH_SECRET=${REFRESH_SECRET:-请生成另一个随机字符串}
      - JWT_EXPIRES_IN=1h
      - REFRESH_EXPIRES_IN=7d
      - BCRYPT_SALT_ROUNDS=10
      - SITE_URL=${SITE_URL:-https://your-domain.com}
      - SITE_TITLE=${SITE_TITLE:-My Blog}
      - SITE_DESCRIPTION=${SITE_DESCRIPTION:-个人博客}
      - RESEND_API_KEY=${RESEND_API_KEY:-re_xxxxxxxxxxxxx}
      - MAIL_FROM=${MAIL_FROM:-My Blog <noreply@your-domain.com>}
      - MAIL_CODE_EXPIRES_IN=300
      - MAIL_RESEND_INTERVAL=60
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-https://your-domain.com}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  front:
    build: ./front
    container_name: danica-front
    ports:
      - "80:80"
    depends_on:
      - back
    restart: unless-stopped

  manager:
    build: ./front-manager
    container_name: danica-manager
    profiles: ["admin"]
    ports:
      - "8080:80"
    depends_on:
      - back
    restart: unless-stopped

volumes:
  mysql-data:
